<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="app-version" content="v32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="節目カレンダー">
<link rel="manifest" href="manifest.webmanifest">
<title>節目カレンダー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222;background:#f7f7f7}
*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:18px}
h1{font-size:25px;margin:0 0 4px}.sub{color:#666;font-size:13px;margin-bottom:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}
button,input,select{font:inherit}button{min-height:44px;border-radius:10px;border:1px solid #ccc;background:#fff;padding:8px 13px}
.primary{background:#222;color:#fff;border-color:#222}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:12px;color:#777;padding:4px}.day{min-height:78px;padding:6px;text-align:left;vertical-align:top}.today{outline:2px solid #222}.selected{background:#eee}
.event{font-size:11px;line-height:1.35;margin-top:4px;overflow:hidden}.muted{color:#777;font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff}
.hidden{display:none}.item{border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:8px}.saved-item{touch-action:none;cursor:grab}.saved-item.dragging{opacity:.55}.drag-handle{display:inline-block;margin-right:6px;color:#777;font-size:18px}.danger{color:#a00}
@media(max-width:420px){main{padding:12px}.day{min-height:68px;padding:4px}.event{font-size:10px}.card{padding:12px}}

  .picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:9999;display:flex;align-items:flex-start;justify-content:center;padding-top:92px}.picker-overlay.hidden{display:none}
  .picker-sheet{width:min(92vw,430px);background:#fff;border:1px solid #ddd;border-radius:18px;padding:14px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,.24);position:relative}
  .picker-sheet::before{content:"";position:absolute;top:-9px;left:50%;width:18px;height:18px;background:#fff;border-left:1px solid #ddd;border-top:1px solid #ddd;transform:translateX(-50%) rotate(45deg)}
  .picker-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-bottom:10px;position:relative;z-index:1}
  .picker-header strong{font-size:18px;text-align:center}
  .picker-cancel,.picker-confirm{min-height:44px;border-radius:11px;padding:8px 14px}
  .picker-cancel{justify-self:start;border:1px solid #ccc;background:#fff}
  .picker-confirm{justify-self:end;background:#222;color:#fff;border:1px solid #222}
  .wheel-labels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:13px;color:#777;font-weight:600;margin-bottom:4px}
  .wheel-labels span{text-align:center}
  .wheel-wrap{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;height:250px;overflow:hidden}
  .wheel-column{height:250px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;padding:100px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .wheel-column::-webkit-scrollbar{display:none}
  .wheel-option{height:54px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:20px;color:#888;user-select:none}
  .wheel-option.selected{font-size:24px;font-weight:700;color:#111}
  .wheel-selection{position:absolute;left:0;right:0;top:100px;height:54px;border-top:1px solid #ddd;border-bottom:1px solid #ddd;pointer-events:none;z-index:2}
  .wheel-fade{position:absolute;left:0;right:0;top:0;height:250px;pointer-events:none;z-index:3;background:linear-gradient(to bottom,rgba(255,255,255,.98),rgba(255,255,255,0) 28%,rgba(255,255,255,0) 72%,rgba(255,255,255,.98))}
  .picker-help{text-align:center;color:#777;margin:12px 0 0;font-size:13px}
  @media(max-width:480px){.picker-sheet{padding-left:12px;padding-right:12px}.picker-header strong{font-size:17px}}

  /* v11: PC / iPhone 共通の中央ポップアップ */
  .picker-overlay{padding:0 14px;align-items:flex-start;justify-content:center}
  .picker-sheet{width:min(92vw,430px);margin-top:clamp(86px,12vh,145px)}
  .wheel-wrap{height:250px;gap:8px}
  .wheel-column{height:250px;padding:98px 0;touch-action:pan-y}
  .wheel-selection{top:98px;height:54px}
  .wheel-fade{height:250px}
  @media(max-width:600px){
    .picker-overlay{padding:0 10px}
    .picker-sheet{width:min(94vw,390px);margin-top:88px;border-radius:18px;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
    .picker-header strong{font-size:17px}
    .picker-cancel,.picker-confirm{min-height:42px;padding:7px 11px}
    .wheel-wrap{height:238px;grid-template-columns:1fr 1fr 1fr;gap:5px}
    .wheel-column{height:238px;padding:92px 0}
    .wheel-selection{top:92px;height:54px}
    .wheel-fade{height:238px}
    .wheel-option{height:54px;font-size:19px}
    .wheel-option.selected{font-size:23px}
    .picker-help{font-size:12px;margin-top:10px}
  }
  @media(min-width:601px){
    .picker-sheet{margin-top:105px}
  }
  .calendar-date-trigger{position:relative;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:inherit;padding:8px 6px;line-height:1;min-height:44px;cursor:pointer}.calendar-date-trigger #monthPickerLabel{pointer-events:none}.calendar-date-trigger input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;padding:0;cursor:pointer;z-index:2}
</style>
</head>
<body>
<main>
  <h1>節目カレンダー</h1>
  <div class="sub">過去の出来事が、今年の節目になる</div>

  <section class="card">
    <div class="row">
      <button id="prev" type="button">‹</button><div style="display:flex;align-items:center;gap:8px"><span class="calendar-date-trigger"><span id="monthPickerLabel">2026年8月</span><input id="calendarDatePicker" type="date" aria-label="年月日を選択"></span><button id="todayBtn" type="button">本日</button></div><button id="next" type="button">›</button>
    </div>
    <div id="cal" class="calendar" style="margin-top:10px"></div>
  </section>

  <div id="monthPicker" class="picker-overlay hidden" aria-hidden="true">
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="picker-header">
        <button id="cancelPicker" type="button" class="picker-cancel">キャンセル</button>
        <strong id="pickerTitle">年月日を選択</strong>
        <button id="applyWheel" type="button" class="picker-confirm">決定</button>
      </div>
      <div class="wheel-labels"><span>年</span><span>月</span><span>日</span></div>
      <div class="wheel-wrap">
        <div class="wheel-fade"></div>
        <div class="wheel-selection"></div>
        <div class="wheel-column" id="wheelYear"></div>
        <div class="wheel-column" id="wheelMonth"></div>
        <div class="wheel-column" id="wheelDay"></div>
      </div>
      <p class="picker-help">上下にスワイプして年月を選択</p>
    </div>
  </div>

  <section class="card">
    <div class="row"><strong id="selectedTitle">今日の節目</strong><span id="count" class="muted"></span></div>
    <div id="details"></div>
  </section>

  <section class="card">
    <div class="row"><strong>出来事を登録</strong><button id="toggleForm">＋ 登録</button></div>
    <form id="form" class="hidden">
      <label for="type">種類</label>
      <select id="type">
        <option value="birthday">誕生日</option>
        <option value="anniversary">周年・記念日</option>
        <option value="memorial">回忌</option>
        <option value="other">その他</option>
      </select>
      <label for="name">名前</label>
      <input id="name" required maxlength="40" placeholder="例：父、母、入社、結婚">
      <label for="date">基準日</label>
      <input id="date" type="date" required>
      <label for="memo">出来事・メモ</label>
      <input id="memo" maxlength="100" placeholder="任意">
      <div class="actions" style="margin-top:12px"><button class="primary" type="submit">保存</button><button id="cancel" type="button">キャンセル</button></div>
      <p id="hint" class="muted"></p>
    </form>
  </section>

  <section class="card">
    <div class="row"><button id="savedToggle" type="button" style="border:0;background:transparent;padding:8px 0;font-weight:700">登録済み　<span id="savedArrow">▼</span></button><span id="savedCount" class="muted"></span></div>
    <div id="savedBody">
    <div id="list"></div>
    <button id="clearAll" type="button" class="danger" style="margin-top:10px">全データを削除</button>
    </div>
  </section>
</main>

<script>
(() => {
  const KEY="setsumei-calendar-events-v1";
  const now=new Date(), today={y:now.getFullYear(),m:now.getMonth(),d:now.getDate()};
  let view=new Date(today.y,today.m,1), selected={...today};
  const $=id=>document.getElementById(id);
  const pad=n=>String(n).padStart(2,"0");
  const parse=s=>{const [y,m,d]=s.split("-").map(Number);return {y,m:m-1,d}};
  const dateStr=()=>`${today.y}-${pad(today.m+1)}-${pad(today.d)}`;
  let events=load();

  function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}
  function save(){localStorage.setItem(KEY,JSON.stringify(events))}
  function sameMD(e,m,d){const x=parse(e.date);return x.m===m&&x.d===d}
  function years(e,y){return y-parse(e.date).y}
  function calc(e,y){
    const n=years(e,y);
    if(n<0)return "";
    if(e.type==="birthday")return n+"歳";
    if(e.type==="anniversary")return n>0?n+"周年":"当日";
    if(e.type==="memorial"){
      if(n===1)return "一周忌";
      const map={2:"三回忌",6:"七回忌",12:"十三回忌",16:"十七回忌",22:"二十三回忌",26:"二十七回忌",32:"三十三回忌",36:"三十七回忌",49:"五十回忌"};
      return map[n]||"";
    }
    return n>0?n+"年目":"";
  }
  function icon(t){return t==="birthday"?"🎂":t==="memorial"?"🕊️":t==="anniversary"?"🎉":"📅"}
  function onDate(y,m,d){return events.map(e=>({...e,calc:calc(e,y)})).filter(e=>sameMD(e,m,d)&&e.calc)}
  const calendarDatePicker=$("calendarDatePicker"),monthPickerLabel=$("monthPickerLabel");
  function syncCalendarDatePicker(){calendarDatePicker.value=`${selected.y}-${pad(selected.m+1)}-${pad(selected.d)}`;monthPickerLabel.textContent=`${view.getFullYear()}年${view.getMonth()+1}月`;}
  syncCalendarDatePicker();
  calendarDatePicker.addEventListener("change",()=>{if(!calendarDatePicker.value)return;const d=parse(calendarDatePicker.value);selected={y:d.y,m:d.m,d:d.d};view=new Date(d.y,d.m,1);syncCalendarDatePicker();render()});
  function render(){
    const y=view.getFullYear(),m=view.getMonth();
    $("monthPickerBtn").textContent=`${y}年${m+1}月`;
    $("cal").innerHTML=["日","月","火","水","木","金","土"].map(x=>`<div class="dow">${x}</div>`).join("");
    const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
    for(let i=0;i<first;i++)$("cal").insertAdjacentHTML("beforeend","<div></div>");
    for(let d=1;d<=last;d++){
      const es=onDate(y,m,d), td=y===today.y&&m===today.m&&d===today.d, sel=y===selected.y&&m===selected.m&&d===selected.d;
      const b=document.createElement("button"); b.type="button"; b.className="day"+(td?" today":"")+(sel?" selected":"");
      b.innerHTML=`<strong>${d}</strong>`+es.slice(0,3).map(e=>`<div class="event">${icon(e.type)} ${escapeHtml(e.name)} ${escapeHtml(e.calc)}</div>`).join("")+(es.length>3?`<div class="event">＋${es.length-3}件</div>`:"");
      b.onclick=()=>{selected={y,m,d};render();renderDetails()};
      $("cal").appendChild(b);
    }
    renderDetails();renderList();
  }
  function renderDetails(){
    const es=onDate(selected.y,selected.m,selected.d);
    $("selectedTitle").textContent=`${selected.y}年${selected.m+1}月${selected.d}日`;
    $("count").textContent=es.length?es.length+"件":"";
    $("details").innerHTML=es.length?es.map(e=>`<div class="item"><strong>${icon(e.type)} ${escapeHtml(e.name)}　${escapeHtml(e.calc)}</strong><div class="muted">基準日：${e.date.replaceAll("-","/")}${e.memo?"　"+escapeHtml(e.memo):""}</div></div>`).join(""):`<p class="muted">この日の節目はありません。</p>`;
  }
  function renderList(){
    $("savedCount").textContent=events.length+"件";

    // 表示用のコピーだけを基準日の新しい順に並べる。
    // events本体は変更しないため、v20の登録データ構造を維持する。
    const displayEvents=[...events].sort((a,b)=>b.date.localeCompare(a.date));

    $("list").innerHTML=displayEvents.length
      ? displayEvents.map(e=>`<div class="item saved-item">
          <div><strong>${icon(e.type)} ${escapeHtml(e.name)}</strong></div>
          <div class="muted">${e.date.replaceAll("-","/")}　${escapeHtml(e.memo||"")}</div>
          <button type="button" data-del="${events.indexOf(e)}" style="margin-top:7px">削除</button>
        </div>`).join("")
      : `<p class="muted">まだ登録されていません。</p>`;

    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      events.splice(Number(b.dataset.del),1);
      save();
      render();
    });
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function hint(){const t=$("type").value;$("hint").textContent=t==="memorial"?"亡くなった日から一周忌・三回忌・七回忌などを自動表示します。":t==="birthday"?"生年月日から毎年の年齢を自動表示します。":t==="anniversary"?"基準日から毎年の周年を自動表示します。":"毎年の同じ日に出来事を表示します。"}
  $("todayBtn").onclick=()=>{view=new Date(today.y,today.m,1);selected={...today};syncCalendarDatePicker();render()};
  $("prev").onclick=()=>{view.setMonth(view.getMonth()-1);syncCalendarDatePicker();render()};
  $("next").onclick=()=>{view.setMonth(view.getMonth()+1);syncCalendarDatePicker();render()};
  

  const monthBtn=$("monthPickerBtn"), picker=$("monthPicker"),
        wheelYear=$("wheelYear"), wheelMonth=$("wheelMonth"), wheelDay=$("wheelDay");
  let pickerYear=view.getFullYear(), pickerMonth=view.getMonth(), pickerDay=selected.d||new Date().getDate();

  function makeWheelOption(label,value,selected){
    const el=document.createElement("div");
    el.className="wheel-option"+(selected?" selected":"");
    el.dataset.value=value; el.textContent=label; return el;
  }

  function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }

  function updateWheel(container){
    const center=container.scrollTop+container.clientHeight/2;
    let best=null,dist=Infinity;
    [...container.children].forEach(el=>{
      const c=el.offsetTop+el.offsetHeight/2,d=Math.abs(c-center);
      el.classList.remove("selected");
      if(d<dist){dist=d;best=el}
    });
    if(best){best.classList.add("selected");return Number(best.dataset.value)}
    return null;
  }

  function rebuildDays(){
    const max=daysInMonth(pickerYear,pickerMonth);
    if(pickerDay>max) pickerDay=max;
    wheelDay.innerHTML="";
    for(let d=1;d<=max;d++) wheelDay.appendChild(makeWheelOption(d+"日",d,d===pickerDay));
    requestAnimationFrame(()=>{
      wheelDay.scrollTop=(pickerDay-1)*54;
      updateWheel(wheelDay);
    });
  }

  function buildPicker(){
    pickerYear=view.getFullYear();
    pickerMonth=view.getMonth();
    pickerDay=selected.d || 1;

    const max=daysInMonth(pickerYear,pickerMonth);
    if(pickerDay>max) pickerDay=max;

    wheelYear.innerHTML=""; wheelMonth.innerHTML=""; wheelDay.innerHTML="";
    for(let y=1900;y<=2100;y++) wheelYear.appendChild(makeWheelOption(y+"年",y,y===pickerYear));
    for(let m=0;m<12;m++) wheelMonth.appendChild(makeWheelOption((m+1)+"月",m,m===pickerMonth));
    for(let d=1;d<=max;d++) wheelDay.appendChild(makeWheelOption(d+"日",d,d===pickerDay));

    requestAnimationFrame(()=>{
      wheelYear.scrollTop=(pickerYear-1900)*54;
      wheelMonth.scrollTop=pickerMonth*54;
      wheelDay.scrollTop=(pickerDay-1)*54;
      updateWheel(wheelYear); updateWheel(wheelMonth); updateWheel(wheelDay);
    });
  }

  function watchWheel(el,isYear,isMonth){
    let timer=null;
    el.addEventListener("scroll",()=>{
      clearTimeout(timer);
      timer=setTimeout(()=>{
        const v=updateWheel(el);
        if(v===null)return;
        if(isYear){
          pickerYear=v;
          const oldDay=pickerDay;
          rebuildDays();
          pickerDay=Math.min(oldDay,daysInMonth(pickerYear,pickerMonth));
          requestAnimationFrame(()=>{wheelDay.scrollTop=(pickerDay-1)*54;updateWheel(wheelDay)});
        }else if(isMonth){
          pickerMonth=v;
          const oldDay=pickerDay;
          rebuildDays();
          pickerDay=Math.min(oldDay,daysInMonth(pickerYear,pickerMonth));
          requestAnimationFrame(()=>{wheelDay.scrollTop=(pickerDay-1)*54;updateWheel(wheelDay)});
        }else{
          pickerDay=v;
        }
      },80);
    });
  }

  watchWheel(wheelYear,true,false);
  watchWheel(wheelMonth,false,true);
  watchWheel(wheelDay,false,false);

  monthBtn.onclick=()=>{
    buildPicker();
    picker.classList.remove("hidden");
    picker.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
  };

  $("cancelPicker").onclick=()=>{
    picker.classList.add("hidden");
    picker.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
  };

  picker.addEventListener("click",e=>{
    if(e.target===picker) $("cancelPicker").click();
  });

  $("applyWheel").onclick=()=>{
    selected={y:pickerYear,m:pickerMonth,d:pickerDay};
    view=new Date(pickerYear,pickerMonth,1);
    picker.classList.add("hidden");
    picker.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
    render();
  };

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&!picker.classList.contains("hidden")) $("cancelPicker").click();
  });
  $("toggleForm").onclick=()=>{$("form").classList.toggle("hidden");$("date").value=dateStr();hint()};
  $("savedToggle").onclick=()=>{$("savedBody").classList.toggle("hidden");$("savedArrow").textContent=$("savedBody").classList.contains("hidden")?"▶":"▼"};
  $("cancel").onclick=()=>$("form").classList.add("hidden");
  $("type").onchange=hint;
  $("form").onsubmit=e=>{e.preventDefault();const x={type:$("type").value,name:$("name").value.trim(),date:$("date").value,memo:$("memo").value.trim()};if(!x.name||!x.date)return;events.push(x);save();const d=parse(x.date);view=new Date(today.y,d.m,1);selected={y:today.y,m:d.m,d:d.d};e.target.reset();$("form").classList.add("hidden");render()};
  $("clearAll").onclick=()=>{if(confirm("登録したすべてのデータを削除します。よろしいですか？")){events=[];save();render()}};
  render();
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body>
</html>
