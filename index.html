<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="節目カレンダー">
<link rel="manifest" href="manifest.webmanifest">
<title>節目カレンダー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222;background:#f7f7f7}
*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:18px}
h1{font-size:25px;margin:0 0 4px}.sub{color:#666;font-size:13px;margin-bottom:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}
button,input,select{font:inherit}button{min-height:44px;border-radius:10px;border:1px solid #ccc;background:#fff;padding:8px 13px}
.primary{background:#222;color:#fff;border-color:#222}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:12px;color:#777;padding:4px}.day{min-height:78px;padding:6px;text-align:left;vertical-align:top}.today{outline:2px solid #222}.selected{background:#eee}
.event{font-size:11px;line-height:1.35;margin-top:4px;overflow:hidden}.muted{color:#777;font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff}
.hidden{display:none}.item{border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:8px}.saved-item{touch-action:none;cursor:grab}.saved-item.dragging{opacity:.55}.drag-handle{display:inline-block;margin-right:6px;color:#777;font-size:18px}.danger{color:#a00}
@media(max-width:420px){main{padding:12px}.day{min-height:68px;padding:4px}.event{font-size:10px}.card{padding:12px}}


  /* v14: 基準日の見た目に統一した iPhone風 年月日ピッカー */
  .picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:9999;display:flex;align-items:flex-start;justify-content:center;padding:0 12px}
  .picker-overlay.hidden{display:none}
  .picker-sheet{width:min(92vw,390px);margin-top:clamp(110px,18vh,180px);background:#111;color:#fff;border-radius:28px;padding:18px 16px 18px;box-shadow:0 18px 55px rgba(0,0,0,.45);overflow:hidden}
  .ios-picker-top{height:48px;display:flex;align-items:center;padding:0 8px}
  .ios-picker-top strong{font-size:20px;color:#4f8cff;font-weight:600}
  .wheel-labels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;color:#777;font-size:0;height:0;overflow:hidden}
  .wheel-wrap{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;height:260px;overflow:hidden}
  .wheel-column{height:260px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;padding:103px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .wheel-column::-webkit-scrollbar{display:none}
  .wheel-option{height:54px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:20px;color:#555;user-select:none}
  .wheel-option.selected{font-size:24px;font-weight:500;color:#f2f2f2}
  .wheel-selection{position:absolute;left:8px;right:8px;top:103px;height:54px;border-radius:28px;background:#292929;pointer-events:none;z-index:1}
  .wheel-fade{position:absolute;left:0;right:0;top:0;height:260px;pointer-events:none;z-index:3;background:linear-gradient(to bottom,#111 0%,rgba(17,17,17,.92) 14%,rgba(17,17,17,0) 32%,rgba(17,17,17,0) 68%,rgba(17,17,17,.92) 86%,#111 100%)}
  .wheel-column{position:relative;z-index:2}
  .ios-picker-bottom{height:68px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 8px}
  .picker-reset{min-height:54px;min-width:126px;border:0;border-radius:28px;background:#090909;color:#fff;font-size:18px;font-weight:600}
  .picker-check{width:58px;height:58px;min-height:58px;border:0;border-radius:50%;background:#4f8cff;color:#fff;font-size:38px;line-height:58px;padding:0;font-weight:300}
  @media(max-width:600px){
    .picker-overlay{padding:0 10px}
    .picker-sheet{width:min(88vw,360px);margin-top:clamp(105px,15vh,155px);border-radius:28px;padding:16px 12px 16px}
    .ios-picker-top{height:44px;padding-left:10px}
    .ios-picker-top strong{font-size:19px}
    .wheel-wrap{height:250px}
    .wheel-column{height:250px;padding:98px 0}
    .wheel-selection{top:98px;height:54px;left:5px;right:5px}
    .wheel-fade{height:250px}
    .wheel-option{height:54px;font-size:19px}
    .wheel-option.selected{font-size:23px}
    .ios-picker-bottom{height:64px;padding:0 6px}
    .picker-reset{min-width:118px;height:52px;min-height:52px;font-size:17px}
    .picker-check{width:56px;height:56px;min-height:56px;font-size:36px;line-height:56px}
  }
  @media(min-width:601px){
    .picker-sheet{margin-top:130px}
  }
</style>
</head>
<body>
<main>
  <h1>節目カレンダー</h1>
  <div class="sub">過去の出来事が、今年の節目になる</div>

  <section class="card">
    <div class="row">
      <button id="prev" type="button">‹</button><div style="display:flex;align-items:center;gap:8px"><button id="monthPickerBtn" type="button" style="border:0;background:transparent;font-weight:700;font-size:inherit;padding:8px 6px">2026年8月</button><button id="todayBtn" type="button">本日</button></div><button id="next" type="button">›</button>
    </div>
    <div id="cal" class="calendar" style="margin-top:10px"></div>
  </section>

  <div id="datePicker" class="picker-overlay hidden" aria-hidden="true">
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="datePickerTitle">
      <div class="ios-picker-top"><strong id="datePickerTitle">2026年8月27日</strong></div>
      <div class="wheel-labels"><span>年</span><span>月</span><span>日</span></div>
      <div class="wheel-wrap">
        <div class="wheel-fade"></div>
        <div class="wheel-selection"></div>
        <div class="wheel-column" id="dateWheelYear"></div>
        <div class="wheel-column" id="dateWheelMonth"></div>
        <div class="wheel-column" id="dateWheelDay"></div>
      </div>
      <div class="ios-picker-bottom"><button id="resetDatePicker" type="button" class="picker-reset">リセット</button><button id="applyDatePicker" type="button" class="picker-check" aria-label="決定">✓</button></div>
    </div>
  </div>

  <div id="monthPicker" class="picker-overlay hidden" aria-hidden="true">
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="ios-picker-top"><strong id="pickerTitle">2026年8月27日</strong></div>
      <div class="wheel-labels"><span>年</span><span>月</span><span>日</span></div>
      <div class="wheel-wrap">
        <div class="wheel-fade"></div>
        <div class="wheel-selection"></div>
        <div class="wheel-column" id="wheelYear"></div>
        <div class="wheel-column" id="wheelMonth"></div>
        <div class="wheel-column" id="wheelDay"></div>
      </div>
      <div class="ios-picker-bottom"><button id="resetPicker" type="button" class="picker-reset">リセット</button><button id="applyWheel" type="button" class="picker-check" aria-label="決定">✓</button></div>
    </div>
  </div>

  <section class="card">
    <div class="row"><strong id="selectedTitle">今日の節目</strong><span id="count" class="muted"></span></div>
    <div id="details"></div>
  </section>

  <section class="card">
    <div class="row"><strong>出来事を登録</strong><button id="toggleForm">＋ 登録</button></div>
    <form id="form" class="hidden">
      <label for="type">種類</label>
      <select id="type">
        <option value="birthday">誕生日</option>
        <option value="anniversary">周年・記念日</option>
        <option value="memorial">回忌</option>
        <option value="other">その他</option>
      </select>
      <label for="name">名前</label>
      <input id="name" required maxlength="40" placeholder="例：父、母、入社、結婚">
      <label for="date">基準日</label>
      <button id="datePickerBtn" type="button" style="width:100%;text-align:left;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff">基準日を選択</button>
      <input id="date" type="hidden" required>
      <label for="memo">出来事・メモ</label>
      <input id="memo" maxlength="100" placeholder="任意">
      <div class="actions" style="margin-top:12px"><button class="primary" type="submit">保存</button><button id="cancel" type="button">キャンセル</button></div>
      <p id="hint" class="muted"></p>
    </form>
  </section>

  <section class="card">
    <div class="row"><button id="savedToggle" type="button" style="border:0;background:transparent;padding:8px 0;font-weight:700">登録済み　<span id="savedArrow">▼</span></button><span id="savedCount" class="muted"></span></div>
    <div id="savedBody">
    <div id="list"></div>
    <button id="clearAll" type="button" class="danger" style="margin-top:10px">全データを削除</button>
    </div>
  </section>
</main>

<script>
(() => {
  const KEY="setsumei-calendar-events-v1";
  const now=new Date(), today={y:now.getFullYear(),m:now.getMonth(),d:now.getDate()};
  let view=new Date(today.y,today.m,1), selected={...today};
  const $=id=>document.getElementById(id);
  const pad=n=>String(n).padStart(2,"0");
  const parse=s=>{const [y,m,d]=s.split("-").map(Number);return {y,m:m-1,d}};
  const dateStr=()=>`${today.y}-${pad(today.m+1)}-${pad(today.d)}`;
  let events=load();

  function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}
  function save(){localStorage.setItem(KEY,JSON.stringify(events))}
  function sameMD(e,m,d){const x=parse(e.date);return x.m===m&&x.d===d}
  function years(e,y){return y-parse(e.date).y}
  function calc(e,y){
    const n=years(e,y);
    if(n<0)return "";
    if(e.type==="birthday")return n+"歳";
    if(e.type==="anniversary")return n>0?n+"周年":"当日";
    if(e.type==="memorial"){
      if(n===1)return "一周忌";
      const map={2:"三回忌",6:"七回忌",12:"十三回忌",16:"十七回忌",22:"二十三回忌",26:"二十七回忌",32:"三十三回忌",36:"三十七回忌",49:"五十回忌"};
      return map[n]||"";
    }
    return n>0?n+"年目":"";
  }
  function icon(t){return t==="birthday"?"🎂":t==="memorial"?"🕊️":t==="anniversary"?"🎉":"📅"}
  function onDate(y,m,d){return events.map(e=>({...e,calc:calc(e,y)})).filter(e=>sameMD(e,m,d)&&e.calc)}
  function render(){
    const y=view.getFullYear(),m=view.getMonth();
    $("monthPickerBtn").textContent=`${y}年${m+1}月`;
    $("cal").innerHTML=["日","月","火","水","木","金","土"].map(x=>`<div class="dow">${x}</div>`).join("");
    const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
    for(let i=0;i<first;i++)$("cal").insertAdjacentHTML("beforeend","<div></div>");
    for(let d=1;d<=last;d++){
      const es=onDate(y,m,d), td=y===today.y&&m===today.m&&d===today.d, sel=y===selected.y&&m===selected.m&&d===selected.d;
      const b=document.createElement("button"); b.type="button"; b.className="day"+(td?" today":"")+(sel?" selected":"");
      b.innerHTML=`<strong>${d}</strong>`+es.slice(0,3).map(e=>`<div class="event">${icon(e.type)} ${escapeHtml(e.name)} ${escapeHtml(e.calc)}</div>`).join("")+(es.length>3?`<div class="event">＋${es.length-3}件</div>`:"");
      b.onclick=()=>{selected={y,m,d};render();renderDetails()};
      $("cal").appendChild(b);
    }
    renderDetails();renderList();
  }
  function renderDetails(){
    const es=onDate(selected.y,selected.m,selected.d);
    $("selectedTitle").textContent=`${selected.y}年${selected.m+1}月${selected.d}日`;
    $("count").textContent=es.length?es.length+"件":"";
    $("details").innerHTML=es.length?es.map(e=>`<div class="item"><strong>${icon(e.type)} ${escapeHtml(e.name)}　${escapeHtml(e.calc)}</strong><div class="muted">基準日：${e.date.replaceAll("-","/")}${e.memo?"　"+escapeHtml(e.memo):""}</div></div>`).join(""):`<p class="muted">この日の節目はありません。</p>`;
  }
  function renderList(){
    $("savedCount").textContent=events.length+"件";
    $("list").innerHTML=events.length?events.map((e,i)=>`<div class="item saved-item" draggable="true" data-index="${i}"><div><span class="drag-handle">☷</span><strong>${icon(e.type)} ${escapeHtml(e.name)}</strong></div><div class="muted">${e.date.replaceAll("-","/")}　${escapeHtml(e.memo||"")}</div><button type="button" data-del="${i}" style="margin-top:7px">削除</button></div>`).join(""):`<p class="muted">まだ登録されていません。</p>`;

    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      events.splice(Number(b.dataset.del),1); save(); render();
    });

    const items=[...document.querySelectorAll(".saved-item")];
    let dragIndex=null, holdTimer=null, dragging=false;

    items.forEach(item=>{
      item.addEventListener("dragstart",e=>{
        dragIndex=Number(item.dataset.index); dragging=true; item.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";
      });
      item.addEventListener("dragend",()=>{
        item.classList.remove("dragging"); dragIndex=null; dragging=false; renderList();
      });
      item.addEventListener("dragover",e=>{
        e.preventDefault();
        if(dragIndex===null)return;
        const overIndex=Number(item.dataset.index);
        if(overIndex===dragIndex)return;
        const rect=item.getBoundingClientRect();
        const before=e.clientY<rect.top+rect.height/2;
        const target=before?overIndex:overIndex+1;
        const moved=events.splice(dragIndex,1)[0];
        events.splice(target>dragIndex?target-1:target,0,moved);
        dragIndex=before?overIndex:overIndex;
        save(); renderList();
      });

      item.addEventListener("pointerdown",e=>{
        if(e.target.closest("button"))return;
        if(e.pointerType==="mouse")return;
        holdTimer=setTimeout(()=>{
          dragging=true; dragIndex=Number(item.dataset.index); item.classList.add("dragging");
          if(item.setPointerCapture)item.setPointerCapture(e.pointerId);
        },450);
      });
      item.addEventListener("pointermove",e=>{
        if(!dragging||dragIndex===null)return;
        const target=item.parentElement.querySelector(".saved-item:not(.dragging)");
        const el=document.elementFromPoint(e.clientX,e.clientY)?.closest(".saved-item");
        if(!el||el===item)return;
        const overIndex=Number(el.dataset.index), rect=el.getBoundingClientRect();
        const before=e.clientY<rect.top+rect.height/2;
        const insertIndex=before?overIndex:overIndex+1;
        if(overIndex===dragIndex || (insertIndex===dragIndex) || (insertIndex===dragIndex+1))return;
        const moved=events.splice(dragIndex,1)[0];
        const adjusted=insertIndex>dragIndex?insertIndex-1:insertIndex;
        events.splice(adjusted,0,moved);
        dragIndex=adjusted;
        save(); renderList();
        const current=document.querySelector(`.saved-item[data-index="${dragIndex}"]`);
        if(current)current.classList.add("dragging");
      });
      item.addEventListener("pointerup",e=>{
        clearTimeout(holdTimer);
        if(dragging){
          e.preventDefault(); item.classList.remove("dragging");
          dragging=false; dragIndex=null; save(); renderList();
        }
      });
      item.addEventListener("pointercancel",()=>{
        clearTimeout(holdTimer);
        if(dragging){item.classList.remove("dragging");dragging=false;dragIndex=null;renderList();}
      });
    });
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function hint(){const t=$("type").value;$("hint").textContent=t==="memorial"?"亡くなった日から一周忌・三回忌・七回忌などを自動表示します。":t==="birthday"?"生年月日から毎年の年齢を自動表示します。":t==="anniversary"?"基準日から毎年の周年を自動表示します。":"毎年の同じ日に出来事を表示します。"}
  $("todayBtn").onclick=()=>{view=new Date(today.y,today.m,1);selected={...today};render()};
  $("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
  $("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
  



  const monthBtn=$("monthPickerBtn"), picker=$("monthPicker"),
        wheelYear=$("wheelYear"), wheelMonth=$("wheelMonth"), wheelDay=$("wheelDay");
  const dateBtn=$("datePickerBtn"), datePicker=$("datePicker"),
        dateWheelYear=$("dateWheelYear"), dateWheelMonth=$("dateWheelMonth"), dateWheelDay=$("dateWheelDay");
  let calState={y:view.getFullYear(),m:view.getMonth(),d:selected.d||today.d};
  let formState={y:today.y,m:today.m,d:today.d};
  let calOriginal={...calState}, formOriginal={...formState};

  function makeWheelOption(label,value,selected){
    const el=document.createElement("div");
    el.className="wheel-option"+(selected?" selected":"");
    el.dataset.value=value;
    el.textContent=label;
    return el;
  }
  function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
  function updateWheel(container){
    const center=container.scrollTop+container.clientHeight/2;
    let best=null,dist=Infinity;
    [...container.children].forEach(el=>{
      const c=el.offsetTop+el.offsetHeight/2,d=Math.abs(c-center);
      el.classList.remove("selected");
      if(d<dist){dist=d;best=el}
    });
    if(best){best.classList.add("selected");return Number(best.dataset.value)}
    return null;
  }
  function setPickerTitle(id,state){
    $(id).textContent=`${state.y}年${state.m+1}月${state.d}日`;
  }
  function fillWheels(state,wy,wm,wd,titleId){
    const max=daysInMonth(state.y,state.m);
    state.d=Math.min(state.d,max);
    wy.innerHTML="";wm.innerHTML="";wd.innerHTML="";
    for(let yy=1900;yy<=2100;yy++)wy.appendChild(makeWheelOption(yy+"年",yy,yy===state.y));
    for(let mm=0;mm<12;mm++)wm.appendChild(makeWheelOption((mm+1)+"月",mm,mm===state.m));
    for(let dd=1;dd<=max;dd++)wd.appendChild(makeWheelOption(dd+"日",dd,dd===state.d));
    setPickerTitle(titleId,state);
    requestAnimationFrame(()=>{
      wy.scrollTop=(state.y-1900)*54;
      wm.scrollTop=state.m*54;
      wd.scrollTop=(state.d-1)*54;
      updateWheel(wy);updateWheel(wm);updateWheel(wd);
    });
  }
  function attachWheel(wy,wm,wd,state,titleId){
    const timers=new Map();
    function watch(el,key){
      el.addEventListener("scroll",()=>{
        clearTimeout(timers.get(el));
        timers.set(el,setTimeout(()=>{
          const v=updateWheel(el); if(v===null)return;
          if(key==="y"){
            state.y=v;
            state.d=Math.min(state.d,daysInMonth(state.y,state.m));
            fillWheels(state,wy,wm,wd,titleId);
          }else if(key==="m"){
            state.m=v;
            state.d=Math.min(state.d,daysInMonth(state.y,state.m));
            fillWheels(state,wy,wm,wd,titleId);
          }else{
            state.d=v;
            setPickerTitle(titleId,state);
          }
        },70));
      });
    }
    watch(wy,"y");watch(wm,"m");watch(wd,"d");
  }

  attachWheel(wheelYear,wheelMonth,wheelDay,calState,"pickerTitle");
  attachWheel(dateWheelYear,dateWheelMonth,dateWheelDay,formState,"datePickerTitle");

  function lockScroll(){document.body.style.overflow="hidden"}
  function unlockScroll(){document.body.style.overflow=""}

  function openCalendarPicker(){
    calState={y:view.getFullYear(),m:view.getMonth(),d:selected.d||today.d};
    calOriginal={...calState};
    fillWheels(calState,wheelYear,wheelMonth,wheelDay,"pickerTitle");
    picker.classList.remove("hidden");picker.setAttribute("aria-hidden","false");lockScroll();
  }
  monthBtn.onclick=openCalendarPicker;

  $("resetPicker").onclick=()=>{
    calState={...calOriginal};
    fillWheels(calState,wheelYear,wheelMonth,wheelDay,"pickerTitle");
  };
  $("applyWheel").onclick=()=>{
    selected={...calState};
    view=new Date(calState.y,calState.m,1);
    picker.classList.add("hidden");picker.setAttribute("aria-hidden","true");unlockScroll();render();
  };
  picker.addEventListener("click",e=>{if(e.target===picker){picker.classList.add("hidden");picker.setAttribute("aria-hidden","true");unlockScroll()}});

  function openDatePicker(){
    const current=$("date").value;
    if(current){
      const p=parse(current);formState={y:p.y,m:p.m,d:p.d};
    }else{
      const n=new Date();formState={y:n.getFullYear(),m:n.getMonth(),d:n.getDate()};
    }
    formOriginal={...formState};
    fillWheels(formState,dateWheelYear,dateWheelMonth,dateWheelDay,"datePickerTitle");
    datePicker.classList.remove("hidden");datePicker.setAttribute("aria-hidden","false");lockScroll();
  }
  dateBtn.onclick=openDatePicker;

  $("resetDatePicker").onclick=()=>{
    formState={...formOriginal};
    fillWheels(formState,dateWheelYear,dateWheelMonth,dateWheelDay,"datePickerTitle");
  };
  $("applyDatePicker").onclick=()=>{
    const value=`${formState.y}-${pad(formState.m+1)}-${pad(formState.d)}`;
    $("date").value=value;
    dateBtn.textContent=`${formState.y}年${formState.m+1}月${formState.d}日`;
    datePicker.classList.add("hidden");datePicker.setAttribute("aria-hidden","true");unlockScroll();
  };
  datePicker.addEventListener("click",e=>{if(e.target===datePicker){datePicker.classList.add("hidden");datePicker.setAttribute("aria-hidden","true");unlockScroll()}});

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      if(!picker.classList.contains("hidden")){$("resetPicker").click();picker.classList.add("hidden");picker.setAttribute("aria-hidden","true");unlockScroll()}
      if(!datePicker.classList.contains("hidden")){$("resetDatePicker").click();datePicker.classList.add("hidden");datePicker.setAttribute("aria-hidden","true");unlockScroll()}
    }
  });
  $("toggleForm").onclick=()=>{$("form").classList.toggle("hidden");$("date").value=dateStr();const p=parse($("date").value);formState={y:p.y,m:p.m,d:p.d};$("datePickerBtn").textContent=`${p.y}年${p.m+1}月${p.d}日`;hint()};
  $("savedToggle").onclick=()=>{$("savedBody").classList.toggle("hidden");$("savedArrow").textContent=$("savedBody").classList.contains("hidden")?"▶":"▼"};
  $("cancel").onclick=()=>$("form").classList.add("hidden");
  $("type").onchange=hint;
  $("form").onsubmit=e=>{e.preventDefault();const x={type:$("type").value,name:$("name").value.trim(),date:$("date").value,memo:$("memo").value.trim()};if(!x.name||!x.date)return;events.push(x);save();const d=parse(x.date);view=new Date(today.y,d.m,1);selected={y:today.y,m:d.m,d:d.d};e.target.reset();$("form").classList.add("hidden");render()};
  $("clearAll").onclick=()=>{if(confirm("登録したすべてのデータを削除します。よろしいですか？")){events=[];save();render()}};
  render();
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body>
</html>
